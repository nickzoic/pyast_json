name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest no longer ships Python 3.9, so use 22.04 for it.
        include:
          - {os: ubuntu-22.04, python-version: "3.9"}
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: macos-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install ".[test]"

      - name: Test with coverage
        run: >-
          python -m pytest
          --cov --cov-report=term-missing --cov-report=xml
          --junitxml=pytest-results.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  stdlib:
    name: Whole standard library (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python-version: "3.9"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - run: python -m pytest --runslow -k whole_stdlib -p no:cacheprovider

  fuzz:
    name: Fuzz (longer run, Python 3.13)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test]"
      - name: Fuzz with 2000 examples per property
        env:
          PYAST_FUZZ_EXAMPLES: "2000"
        run: python -m pytest -m fuzz -p no:cacheprovider
